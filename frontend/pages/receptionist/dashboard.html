<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist Dashboard - Hospital Management System</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dark-mode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header"><h2><i class="fas fa-hospital"></i> HMS</h2></div>
            <nav class="sidebar-nav">
                <button class="nav-item active"><i class="fas fa-tachometer-alt"></i> Dashboard</button>
                <button class="nav-item" onclick="window.location.href='../admin/patients.html'"><i class="fas fa-users"></i> Patients</button>
                <button class="nav-item" onclick="window.location.href='../admin/appointments.html'"><i class="fas fa-calendar-check"></i> Appointments</button>
                <button class="nav-item"><i class="fas fa-procedures"></i> OPD/IPD</button>
                <button class="nav-item"><i class="fas fa-file-invoice"></i> Billing</button>
                <hr style="border-color:rgba(255,255,255,0.1);margin:12px 20px;">
                <button class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </nav>
        </aside>
        <div class="main-content">
            <div class="top-bar">
                <h1>Receptionist Dashboard</h1>
                <div class="user-info">
                    <button class="dark-mode-toggle" onclick="toggleDarkMode()"><i class="fas fa-moon"></i></button>
                    <span id="userName"></span>
                    <div class="user-avatar" id="userAvatar">R</div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-calendar-check"></i></div><div class="stat-info"><h3 id="todayAppts">0</h3><p>Today's Appointments</p></div></div>
                <div class="stat-card"><div class="stat-icon green"><i class="fas fa-users"></i></div><div class="stat-info"><h3 id="totalPatients">0</h3><p>Total Patients</p></div></div>
                <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-procedures"></i></div><div class="stat-info"><h3 id="activeOPD">0</h3><p>Active OPD</p></div></div>
            </div>

            <div class="card">
                <div class="card-header"><h3>Quick Actions</h3></div>
                <div style="display:flex;gap:12px;flex-wrap:wrap;">
                    <button class="btn btn-primary" onclick="window.location.href='../admin/patients.html'"><i class="fas fa-user-plus"></i> Register Patient</button>
                    <button class="btn btn-success" onclick="window.location.href='../admin/appointments.html'"><i class="fas fa-calendar-plus"></i> Book Appointment</button>
                    <button class="btn btn-warning"><i class="fas fa-procedures"></i> OPD Registration</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h3>Today's Appointments</h3></div>
                <div class="table-container">
                    <table><thead><tr><th>Patient</th><th>Doctor</th><th>Time</th><th>Status</th></tr></thead>
                    <tbody id="apptsTable"></tbody></table>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        async function loadDashboard() {
            try {
                const user = await checkAuth();
                if (!user) return;
                document.getElementById('userName').textContent = user.username;
                document.getElementById('userAvatar').textContent = user.username.charAt(0).toUpperCase();

                const today = new Date().toISOString().split('T')[0];
                const [apptsData, patientsData] = await Promise.all([
                    api.get(`/appointments?date=${today}`),
                    api.get('/patients?per_page=1')
                ]);
                document.getElementById('todayAppts').textContent = apptsData.total;
                document.getElementById('totalPatients').textContent = patientsData.total;
                document.getElementById('activeOPD').textContent = '0';

                const tbody = document.getElementById('apptsTable');
                apptsData.appointments.forEach(a => {
                    tbody.innerHTML += `<tr><td>${escapeHtml(a.patient_name || 'N/A')}</td><td>Dr. ${escapeHtml(a.doctor_name || 'N/A')}</td><td>${escapeHtml(a.time_slot)}</td><td>${getStatusBadge(a.status)}</td></tr>`;
                });
            } catch (err) { showToast(err.message, 'error'); }
        }
        loadDashboard();
    </script>
</body>
</html>
