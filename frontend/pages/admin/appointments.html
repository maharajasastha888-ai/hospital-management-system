<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Hospital Management System</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dark-mode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header"><h2><i class="fas fa-hospital"></i> HMS</h2></div>
            <nav class="sidebar-nav">[nav items]</nav>
        </aside>
        <div class="main-content">
            <div class="top-bar">
                <h1>Appointments</h1>
                <div class="user-info">
                    <button class="dark-mode-toggle" onclick="toggleDarkMode()"><i class="fas fa-moon"></i></button>
                    <span id="userName">Admin</span>
                    <div class="user-avatar" id="userAvatar">A</div>
                </div>
            </div>

            <div class="search-bar">
                <input type="date" id="dateFilter" onchange="loadAppointments()">
                <select id="statusFilter" onchange="loadAppointments()" style="padding:10px 14px;border:2px solid var(--border);border-radius:8px;">
                    <option value="">All Status</option>
                    <option value="scheduled">Scheduled</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                <button class="btn btn-primary" onclick="openBookModal()"><i class="fas fa-plus"></i> Book Appointment</button>
            </div>

            <div class="card">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Patient</th>
                                <th>Doctor</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Reason</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentsTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="appointmentModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Book Appointment</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="appointmentForm">
                    <div class="form-group"><label>Patient</label>
                        <select id="patientSelect" required><option value="">Select Patient</option></select>
                    </div>
                    <div class="form-group"><label>Doctor</label>
                        <select id="doctorSelect" required><option value="">Select Doctor</option></select>
                    </div>
                    <div class="form-group"><label>Date</label>
                        <input type="date" id="appDate" required>
                    </div>
                    <div class="form-group"><label>Time Slot</label>
                        <select id="timeSlot" required><option value="">Select Time</option></select>
                    </div>
                    <div class="form-group"><label>Reason</label>
                        <textarea id="reason" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="bookAppointment()"><i class="fas fa-calendar-check"></i> Book</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        const TIME_SLOTS = ['09:00 AM','09:30 AM','10:00 AM','10:30 AM','11:00 AM','11:30 AM','12:00 PM','12:30 PM','02:00 PM','02:30 PM','03:00 PM','03:30 PM','04:00 PM','04:30 PM','05:00 PM','05:30 PM'];

        document.getElementById('dateFilter').valueAsDate = new Date();

        async function loadAppointments() {
            try {
                let url = '/appointments';
                const params = [];
                const date = document.getElementById('dateFilter').value;
                const status = document.getElementById('statusFilter').value;
                if (date) params.push(`date=${date}`);
                if (status) params.push(`status=${status}`);
                if (params.length) url += '?' + params.join('&');

                const data = await api.get(url);
                const tbody = document.getElementById('appointmentsTable');
                tbody.innerHTML = '';
                data.appointments.forEach(a => {
                    tbody.innerHTML += `<tr>
                        <td>${a.id}</td>
                        <td>${escapeHtml(a.patient_name || 'N/A')}</td>
                        <td>Dr. ${escapeHtml(a.doctor_name || 'N/A')}</td>
                        <td>${formatDate(a.appointment_date)}</td>
                        <td>${escapeHtml(a.time_slot)}</td>
                        <td>${escapeHtml(a.reason || '-')}</td>
                        <td>${getStatusBadge(a.status)}</td>
                        <td>
                            ${a.status === 'scheduled' ? `<button class="btn btn-sm btn-success" onclick="completeAppt(${a.id})"><i class="fas fa-check"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="cancelAppt(${a.id})"><i class="fas fa-times"></i></button>` : ''}
                        </td>
                    </tr>`;
                });
                if (data.appointments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No appointments found</td></tr>';
                }
            } catch (err) { showToast(err.message, 'error'); }
        }

        async function openBookModal() {
            document.getElementById('appointmentForm').reset();
            document.getElementById('appointmentModal').classList.add('active');
            try {
                const patients = await api.get('/patients?per_page=100');
                const select = document.getElementById('patientSelect');
                select.innerHTML = '<option value="">Select Patient</option>';
                patients.patients.forEach(p => {
                    select.innerHTML += `<option value="${p.id}">${escapeHtml(p.full_name)} (${escapeHtml(p.phone)})</option>`;
                });
                const doctors = await api.get('/doctors');
                const docSelect = document.getElementById('doctorSelect');
                docSelect.innerHTML = '<option value="">Select Doctor</option>';
                doctors.forEach(d => {
                    docSelect.innerHTML += `<option value="${d.id}">Dr. ${escapeHtml(d.full_name)} - ${escapeHtml(d.specialization || '')}</option>`;
                });
                const slotSelect = document.getElementById('timeSlot');
                slotSelect.innerHTML = '<option value="">Select Time</option>';
                TIME_SLOTS.forEach(s => {
                    slotSelect.innerHTML += `<option value="${s}">${s}</option>`;
                });
            } catch (err) { showToast(err.message, 'error'); }
        }

        function closeModal() { document.getElementById('appointmentModal').classList.remove('active'); }

        async function bookAppointment() {
            const data = {
                patient_id: parseInt(document.getElementById('patientSelect').value),
                doctor_id: parseInt(document.getElementById('doctorSelect').value),
                appointment_date: document.getElementById('appDate').value,
                time_slot: document.getElementById('timeSlot').value,
                reason: document.getElementById('reason').value
            };
            if (!data.patient_id || !data.doctor_id || !data.appointment_date || !data.time_slot) {
                showToast('Please fill all required fields', 'warning');
                return;
            }
            try {
                await api.post('/appointments', data);
                showToast('Appointment booked successfully', 'success');
                closeModal();
                loadAppointments();
            } catch (err) { showToast(err.message, 'error'); }
        }

        async function cancelAppt(id) {
            if (!confirm('Cancel this appointment?')) return;
            try { await api.put(`/appointments/${id}/cancel`); showToast('Appointment cancelled', 'success'); loadAppointments(); }
            catch (err) { showToast(err.message, 'error'); }
        }

        async function completeAppt(id) {
            try { await api.put(`/appointments/${id}/complete`); showToast('Appointment completed', 'success'); loadAppointments(); }
            catch (err) { showToast(err.message, 'error'); }
        }

        async function init() {
            const user = await checkAuth();
            if (user) {
                document.getElementById('userName').textContent = user.username;
                document.getElementById('userAvatar').textContent = user.username.charAt(0).toUpperCase();
                loadAppointments();
            }
        }
        init();
    </script>
</body>
</html>
