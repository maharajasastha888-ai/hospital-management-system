<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Hospital Management System</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dark-mode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-hospital"></i> HMS</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-page="dashboard" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </button>
                <button class="nav-item" data-page="patients" onclick="window.location.href='patients.html'">
                    <i class="fas fa-users"></i> Patients
                </button>
                <button class="nav-item" data-page="doctors" onclick="window.location.href='doctors.html'">
                    <i class="fas fa-user-md"></i> Doctors
                </button>
                <button class="nav-item" data-page="appointments" onclick="window.location.href='appointments.html'">
                    <i class="fas fa-calendar-check"></i> Appointments
                </button>
                <button class="nav-item" data-page="departments" onclick="window.location.href='departments.html'">
                    <i class="fas fa-building"></i> Departments
                </button>
                <button class="nav-item" data-page="pharmacy" onclick="window.location.href='pharmacy.html'">
                    <i class="fas fa-pills"></i> Pharmacy
                </button>
                <button class="nav-item" data-page="lab" onclick="window.location.href='lab.html'">
                    <i class="fas fa-flask"></i> Laboratory
                </button>
                <button class="nav-item" data-page="billing" onclick="window.location.href='billing.html'">
                    <i class="fas fa-file-invoice"></i> Billing
                </button>
                <button class="nav-item" data-page="reports" onclick="window.location.href='reports.html'">
                    <i class="fas fa-chart-bar"></i> Reports
                </button>
                <hr style="border-color:rgba(255,255,255,0.1);margin:12px 20px;">
                <button class="nav-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <h1>Admin Dashboard</h1>
                <div class="user-info">
                    <button class="dark-mode-toggle" onclick="toggleDarkMode()" title="Toggle Dark Mode">
                        <i class="fas fa-moon"></i>
                    </button>
                    <span id="userName">Admin</span>
                    <div class="user-avatar" id="userAvatar">A</div>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-icon blue"><i class="fas fa-users"></i></div>
                    <div class="stat-info">
                        <h3 id="totalPatients">-</h3>
                        <p>Total Patients</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fas fa-user-md"></i></div>
                    <div class="stat-info">
                        <h3 id="totalDoctors">-</h3>
                        <p>Total Doctors</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange"><i class="fas fa-calendar-check"></i></div>
                    <div class="stat-info">
                        <h3 id="todayAppointments">-</h3>
                        <p>Today's Appointments</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fas fa-dollar-sign"></i></div>
                    <div class="stat-info">
                        <h3 id="monthlyRevenue">-</h3>
                        <p>Monthly Revenue</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple"><i class="fas fa-bed"></i></div>
                    <div class="stat-info">
                        <h3 id="availableBeds">-</h3>
                        <p>Available Beds</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon red"><i class="fas fa-exclamation-triangle"></i></div>
                    <div class="stat-info">
                        <h3 id="lowStock">-</h3>
                        <p>Low Stock Medicines</p>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="charts-grid">
                <div class="card">
                    <div class="card-header">
                        <h3>Revenue Overview</h3>
                    </div>
                    <canvas id="revenueChart" height="250"></canvas>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>Patient Distribution</h3>
                    </div>
                    <canvas id="patientChart" height="250"></canvas>
                </div>
            </div>

            <!-- Today's Appointments -->
            <div class="card">
                <div class="card-header">
                    <h3>Today's Appointments</h3>
                    <a href="appointments.html" class="btn btn-sm btn-primary">View All</a>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Patient</th>
                                <th>Doctor</th>
                                <th>Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentsTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Chatbot Widget -->
    <div class="chatbot-widget">
        <div class="chatbot-box" id="chatbot-box">
            <div class="chatbot-header">
                <i class="fas fa-robot"></i> Health Assistant
            </div>
            <div class="chatbot-messages" id="chatbot-messages"></div>
            <div class="chatbot-input">
                <input type="text" id="chatbot-input-field" placeholder="Type your question...">
                <button class="btn btn-primary btn-sm" onclick="sendChatbotMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
        <button class="chatbot-toggle" onclick="toggleChatbot()">
            <i class="fas fa-comment-dots"></i>
        </button>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/dashboard-charts.js"></script>
    <script src="../../js/chatbot.js"></script>
    <script>
        async function loadDashboard() {
            try {
                const user = await checkAuth();
                if (!user) return;

                document.getElementById('userName').textContent = user.username;
                document.getElementById('userAvatar').textContent = user.username.charAt(0).toUpperCase();

                const data = await api.get('/admin/dashboard');
                document.getElementById('totalPatients').textContent = data.total_patients;
                document.getElementById('totalDoctors').textContent = data.total_doctors;
                document.getElementById('todayAppointments').textContent = data.today_appointments;
                document.getElementById('monthlyRevenue').textContent = '$' + (data.monthly_revenue || 0).toLocaleString();
                document.getElementById('availableBeds').textContent = data.available_beds;
                document.getElementById('lowStock').textContent = data.low_stock_medicines;

                const tbody = document.getElementById('appointmentsTable');
                tbody.innerHTML = '';
                (data.appointments_today || []).forEach(a => {
                    tbody.innerHTML += `<tr>
                        <td>${escapeHtml(a.patient_name || 'N/A')}</td>
                        <td>Dr. ${escapeHtml(a.doctor_name || 'N/A')}</td>
                        <td>${escapeHtml(a.time_slot || 'N/A')}</td>
                        <td>${getStatusBadge(a.status)}</td>
                    </tr>`;
                });

                if (data.appointments_today.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-light);">No appointments today</td></tr>';
                }

                await initDashboardCharts();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        loadDashboard();
    </script>
</body>
</html>
