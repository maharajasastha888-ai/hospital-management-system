<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - Hospital Management System</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dark-mode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header"><h2><i class="fas fa-hospital"></i> HMS</h2></div>
            <nav class="sidebar-nav">[nav items same as dashboard]</nav>
        </aside>
        <div class="main-content">
            <div class="top-bar">
                <h1>Doctor Management</h1>
                <div class="user-info">
                    <button class="dark-mode-toggle" onclick="toggleDarkMode()"><i class="fas fa-moon"></i></button>
                    <span id="userName">Admin</span>
                    <div class="user-avatar" id="userAvatar">A</div>
                </div>
            </div>

            <div class="search-bar">
                <select id="deptFilter" onchange="loadDoctors()" style="padding:10px 14px;border:2px solid var(--border);border-radius:8px;font-size:14px;">
                    <option value="">All Departments</option>
                </select>
                <button class="btn btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> Add Doctor</button>
            </div>

            <div class="card">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Specialization</th>
                                <th>Department</th>
                                <th>Fee</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="doctorsTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="doctorModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add Doctor</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="doctorForm">
                    <input type="hidden" id="doctorId">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                        <div class="form-group"><label>First Name *</label><input type="text" id="firstName" required></div>
                        <div class="form-group"><label>Last Name *</label><input type="text" id="lastName" required></div>
                        <div class="form-group"><label>Specialization</label><input type="text" id="specialization"></div>
                        <div class="form-group"><label>Department</label><select id="departmentId"></select></div>
                        <div class="form-group"><label>Qualification</label><input type="text" id="qualification"></div>
                        <div class="form-group"><label>Consultation Fee ($)</label><input type="number" id="fee" step="0.01"></div>
                        <div class="form-group"><label>Phone</label><input type="tel" id="phone"></div>
                        <div class="form-group"><label>Email</label><input type="email" id="email"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveDoctor()"><i class="fas fa-save"></i> Save</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        async function loadDoctors() {
            try {
                const deptId = document.getElementById('deptFilter').value;
                const url = deptId ? `/doctors?department_id=${deptId}` : '/doctors';
                const doctors = await api.get(url);
                const tbody = document.getElementById('doctorsTable');
                tbody.innerHTML = '';
                doctors.forEach(d => {
                    tbody.innerHTML += `<tr>
                        <td>${d.id}</td>
                        <td><strong>Dr. ${escapeHtml(d.full_name)}</strong></td>
                        <td>${escapeHtml(d.specialization || '-')}</td>
                        <td>${escapeHtml(d.department_name || '-')}</td>
                        <td>${formatCurrency(d.fee)}</td>
                        <td>${escapeHtml(d.phone || '-')}</td>
                        <td>${d.is_available ? '<span class="badge badge-success">Available</span>' : '<span class="badge badge-danger">Unavailable</span>'}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="editDoctor(${d.id})"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="deleteDoctor(${d.id})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
                });
                if (doctors.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-light);">No doctors found</td></tr>';
                }
            } catch (err) { showToast(err.message, 'error'); }
        }

        async function loadDepartments() {
            try {
                const depts = await api.get('/departments');
                populateSelect('departmentId', depts);
                const filter = document.getElementById('deptFilter');
                depts.forEach(d => {
                    filter.innerHTML += `<option value="${d.id}">${escapeHtml(d.name)}</option>`;
                });
            } catch (err) { console.error(err); }
        }

        function openAddModal() {
            document.getElementById('doctorId').value = '';
            document.getElementById('doctorForm').reset();
            document.getElementById('modalTitle').textContent = 'Add Doctor';
            document.getElementById('doctorModal').classList.add('active');
        }

        function closeModal() { document.getElementById('doctorModal').classList.remove('active'); }

        async function saveDoctor() {
            const data = {
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                specialization: document.getElementById('specialization').value,
                department_id: parseInt(document.getElementById('departmentId').value) || null,
                qualification: document.getElementById('qualification').value,
                fee: parseFloat(document.getElementById('fee').value) || 0,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value
            };
            const id = document.getElementById('doctorId').value;
            try {
                if (id) { await api.put(`/doctors/${id}`, data); showToast('Doctor updated', 'success'); }
                else { await api.post('/doctors', data); showToast('Doctor added', 'success'); }
                closeModal(); loadDoctors();
            } catch (err) { showToast(err.message, 'error'); }
        }

        async function editDoctor(id) {
            try {
                const d = await api.get(`/doctors/${id}`);
                document.getElementById('doctorId').value = d.id;
                document.getElementById('firstName').value = d.first_name;
                document.getElementById('lastName').value = d.last_name;
                document.getElementById('specialization').value = d.specialization || '';
                document.getElementById('departmentId').value = d.department_id || '';
                document.getElementById('qualification').value = d.qualification || '';
                document.getElementById('fee').value = d.fee;
                document.getElementById('phone').value = d.phone || '';
                document.getElementById('email').value = d.email || '';
                document.getElementById('modalTitle').textContent = 'Edit Doctor';
                document.getElementById('doctorModal').classList.add('active');
            } catch (err) { showToast(err.message, 'error'); }
        }

        async function deleteDoctor(id) {
            if (!confirm('Delete this doctor?')) return;
            try { await api.delete(`/doctors/${id}`); showToast('Doctor deleted', 'success'); loadDoctors(); }
            catch (err) { showToast(err.message, 'error'); }
        }

        async function init() {
            const user = await checkAuth();
            if (user) {
                document.getElementById('userName').textContent = user.username;
                document.getElementById('userAvatar').textContent = user.username.charAt(0).toUpperCase();
                await loadDepartments();
                await loadDoctors();
            }
        }
        init();
    </script>
</body>
</html>
